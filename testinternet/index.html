<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>SpeedTest - Premium Crown</title>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
        <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
        <style>
        :root {
            --bg-1: #0a0e1a;
            --bg-2: #1a1f35;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.15);
            --accent-download: #d57cff;
            --accent-upload: #2be1d6;
            --accent-ping: #ffb347;
            --accent-complete: #4dff91;
            --accent-glow-d: rgba(213, 124, 255, 0.4);
            --accent-glow-u: rgba(43, 225, 214, 0.4);
            --accent-glow-p: rgba(255, 179, 71, 0.4);
            --accent-glow-c: rgba(77, 255, 145, 0.4);
            --text-primary: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.7);
            --text-dim: rgba(255, 255, 255, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 100%);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        body::before,
        body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(140px);
            opacity: 0.2;
            animation: float 20s ease-in-out infinite;
            z-index: 0;
        }

        body::before {
            width: 600px;
            height: 600px;
            background: var(--accent-download);
            top: -250px;
            right: -250px;
            animation-delay: 0s;
        }

        body::after {
            width: 500px;
            height: 500px;
            background: var(--accent-upload);
            bottom: -200px;
            left: -200px;
            animation-delay: 10s;
        }

        @keyframes float {

            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }

            33% {
                transform: translate(60px, -60px) scale(1.15);
            }

            66% {
                transform: translate(-40px, 40px) scale(0.85);
            }
        }

        .app-container {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .speedtest-card {
            width: 100%;
            max-width: 1000px;
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            overflow: hidden;
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .header {
            padding: 28px 36px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.02) 100%);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 24px;
        }

        .logo {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 4px;
            background: linear-gradient(135deg, var(--accent-download), var(--accent-upload));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px var(--accent-glow-d);
        }

        .speed-display {
            display: flex;
            gap: 40px;
            align-items: center;
        }

        .speed-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .speed-label {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--text-dim);
            text-transform: uppercase;
        }

        .speed-value {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: 1px;
        }

        .speed-item.download .speed-value {
            color: var(--accent-download);
            text-shadow: 0 0 25px var(--accent-glow-d);
        }

        .speed-item.upload .speed-value {
            color: var(--accent-upload);
            text-shadow: 0 0 25px var(--accent-glow-u);
        }

        .content {
            padding: 40px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 18px;
            padding: 24px;
            backdrop-filter: blur(10px);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .stat-card:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-dim);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 10px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .gauge-section {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 450px;
            margin: 30px 0;
        }

        #gauge {
            max-width: 100%;
        }

        .gauge-center {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            z-index: 2;
        }

        .big-speed {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .big-number {
            font-size: 64px;
            font-weight: 300;
            background: linear-gradient(135deg, var(--accent-download), var(--accent-upload));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
            text-shadow: 0 0 50px var(--accent-glow-d);
            letter-spacing: -2px;
            transition: background 0.3s ease;
        }

        .big-unit {
            font-size: 15px;
            color: var(--text-dim);
            font-weight: 600;
            margin-top: 6px;
            letter-spacing: 3px;
        }

        .test-phase-indicator {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        .test-phase-indicator.active {
            opacity: 1;
        }

        .go-button {
            padding: 18px 56px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.12) 0%, rgba(255, 255, 255, 0.06) 100%);
            border: 2px solid var(--glass-border);
            border-radius: 60px;
            color: var(--text-primary);
            font-size: 17px;
            font-weight: 700;
            letter-spacing: 4px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 6px 28px rgba(0, 0, 0, 0.4);
            position: relative;
            overflow: hidden;
            pointer-events: auto;
            z-index: 10;
        }

        .go-button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: radial-gradient(circle, var(--accent-download), var(--accent-upload));
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
            opacity: 0;
            z-index: -1;
        }

        .go-button:hover::before {
            width: 350px;
            height: 350px;
            opacity: 0.2;
        }

        .go-button:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(43, 225, 214, 0.4);
            border-color: var(--accent-download);
        }

        .go-button:active {
            transform: translateY(-2px);
        }

        .go-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .go-button.running {
            animation: pulse 2.5s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                box-shadow: 0 0 25px var(--accent-glow-d);
            }

            50% {
                box-shadow: 0 0 50px var(--accent-glow-u);
            }
        }

        .server-info-panel {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 18px;
            padding: 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .server-details {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .server-name {
            font-size: 17px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .server-location {
            font-size: 14px;
            color: var(--text-muted);
        }

        .server-provider {
            font-size: 12px;
            color: var(--text-dim);
            font-style: italic;
        }

        .change-server-btn {
            padding: 12px 28px;
            background: transparent;
            border: 1px dashed rgba(255, 255, 255, 0.25);
            border-radius: 10px;
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1.5px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .change-server-btn:hover {
            border-color: var(--accent-download);
            color: var(--accent-download);
            background: rgba(43, 225, 214, 0.08);
        }

        .footer {
            padding: 24px;
            text-align: center;
            color: var(--text-dim);
            font-size: 11px;
            letter-spacing: 1.5px;
        }

        .progress-bar {
            height: 4px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 3px;
            overflow: hidden;
            margin-top: 20px;
            display: none;
        }

        .progress-bar.active {
            display: block;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-download), var(--accent-upload));
            width: 0%;
            transition: width 0.3s ease;
            box-shadow: 0 0 15px var(--accent-glow-d);
        }

        .test-status {
            text-align: center;
            font-size: 14px;
            color: var(--text-muted);
            margin-top: 16px;
            min-height: 24px;
            font-weight: 600;
        }

        @media (max-width: 768px) {
            .header {
                padding: 24px;
            }

            .logo {
                font-size: 22px;
            }

            .speed-display {
                gap: 24px;
            }

            .speed-value {
                font-size: 18px;
            }

            .content {
                padding: 24px;
            }

            .stats-grid {
                grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
                gap: 16px;
            }

            .big-number {
                font-size: 48px;
            }

            .go-button {
                padding: 16px 42px;
                font-size: 15px;
            }

            .gauge-section {
                min-height: 350px;
            }
        }
        </style>
    </head>
    <body>
        <div class="app-container">
            <div class="speedtest-card">
                <div class="header">
                    <div class="logo">SPEEDTEST</div>
                    <div class="speed-display">
                        <div class="speed-item download">
                            <span class="speed-label">Download</span>
                            <span class="speed-value" id="download-result">-- Mbps</span>
                        </div>
                        <div class="speed-item upload">
                            <span class="speed-label">Upload</span>
                            <span class="speed-value" id="upload-result">-- Mbps</span>
                        </div>
                    </div>
                </div>
                <div class="content">
                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-label">Ping</div>
                            <div class="stat-value" id="ping">--</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">Jitter</div>
                            <div class="stat-value" id="jitter">--</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">Packet Loss</div>
                            <div class="stat-value" id="loss">--</div>
                        </div>
                    </div>
                    <div class="gauge-section">
                        <canvas id="gauge" width="650" height="450"></canvas>
                        <div class="gauge-center">
                            <div class="test-phase-indicator" id="phaseIndicator">READY</div>
                            <div class="big-speed">
                                <div class="big-number" id="big-number">0.0</div>
                                <div class="big-unit">MBPS</div>
                            </div>
                            <button class="go-button" id="goBtn">GO</button>
                        </div>
                    </div>
                    <div class="test-status" id="testStatus"></div>
                    <div class="progress-bar" id="progressBar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <div class="server-info-panel">
                        <div class="server-details">
                            <div class="server-name" id="server-name">CloudFlare CDN</div>
                            <div class="server-location" id="server-location">📍 Global Network</div>
                            <div class="server-provider">Multiple Test Servers</div>
                        </div>
                        <button class="change-server-btn" id="changeServer">CHANGE SERVER</button>
                    </div>
                </div>
                <div class="footer">
                    POWERED BY CLAUDE • PREMIUM CROWN DESIGN
                </div>
            </div>
        </div>
        <script>
        $(function () {
            const SERVERS = [
                {
                    name: "CloudFlare CDN",
                    location: "Global Network",
                    downloadUrl: "https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.0/jquery.min.js",
                    uploadUrl: "upload.php",
                    pingUrl: "https://www.cloudflare.com"
                },
                {
                    name: "Google APIs",
                    location: "Global",
                    downloadUrl: "https://ajax.googleapis.com/ajax/libs/jquery/3.7.0/jquery.min.js",
                    uploadUrl: "upload.php",
                    pingUrl: "https://www.google.com"
                }
            ];

            let currentServerIndex = 0;
            let server = SERVERS[currentServerIndex];
            const MAX_SPEED = 500;

            // Définition des couleurs en format hexadécimal pour Canvas
            const COLORS = {
                ping: '#ffb347',
                download: '#d57cff',
                upload: '#2be1d6',
                complete: '#4dff91',
                idle: '#888888'
            };

            const GLOW_COLORS = {
                ping: 'rgba(255, 179, 71, 0.4)',
                download: 'rgba(213, 124, 255, 0.4)',
                upload: 'rgba(43, 225, 214, 0.4)',
                complete: 'rgba(77, 255, 145, 0.4)',
                idle: 'rgba(255, 255, 255, 0.2)'
            };

            const SECONDARY_COLORS = {
                ping: '#ffd700',
                download: '#ff7df9',
                upload: '#00ffd5',
                complete: '#00ffaa',
                idle: '#cccccc'
            };

            const $ping = $('#ping');
            const $jitter = $('#jitter');
            const $loss = $('#loss');
            const $downloadResult = $('#download-result');
            const $uploadResult = $('#upload-result');
            const $bigNumber = $('#big-number');
            const $goBtn = $('#goBtn');
            const $progressBar = $('#progressBar');
            const $progressFill = $('#progressFill');
            const $testStatus = $('#testStatus');
            const $changeServer = $('#changeServer');
            const $phaseIndicator = $('#phaseIndicator');

            const canvas = document.getElementById('gauge');
            const ctx = canvas.getContext('2d');

            let gaugeState = {
                currentSpeed: 0,
                animSpeed: 0,
                currentPhase: 'idle',
                animationProgress: 0,
                pingPulse: 0,
                currentColor: COLORS.idle
            };

            const WIDTH = canvas.width;
            const HEIGHT = canvas.height;
            const centerX = WIDTH / 2;
            const centerY = HEIGHT / 2;
            const crownRadius = Math.min(WIDTH, HEIGHT) * 0.36;
            const crownThickness = 24;

            // Définition de la couronne : de 0 à 300 degrés sur la même ligne horizontale
            const startAngle = 5 * Math.PI / 6; // 150 degrés (bas gauche)
            const endAngle = 13 * Math.PI / 6; // 390 degrés (bas droite)
            const totalAngle = endAngle - startAngle; // 240 degrés

            updateServerDisplay();
            requestAnimationFrame(loop);

            $goBtn.on('click', runAllTests);
            $changeServer.on('click', changeServer);

            function updateServerDisplay() {
                $('#server-name').text(server.name);
                $('#server-location').text('📍 ' + server.location);
            }

            function changeServer() {
                currentServerIndex = (currentServerIndex + 1) % SERVERS.length;
                server = SERVERS[currentServerIndex];
                updateServerDisplay();
                setStatus('Server changed to ' + server.name);
            }

            function setStatus(msg) {
                $testStatus.text(msg);
            }

            function setPhaseIndicator(phase) {
                const text = phase === 'ping' ? 'TESTING PING' :
                    phase === 'download' ? 'DOWNLOADING' :
                        phase === 'upload' ? 'UPLOADING' :
                            phase === 'complete' ? 'COMPLETE' : 'READY';
                $phaseIndicator.text(text);
                $phaseIndicator.toggleClass('active', phase !== 'idle' && phase !== 'complete');
            }

            async function runAllTests() {
                setUIRunning(true);
                setResults('--', '--', '-- ms', '-- ms', '-- %');

                gaugeState = {
                    currentSpeed: 0,
                    animSpeed: 0,
                    currentPhase: 'ping',
                    animationProgress: 0,
                    pingPulse: 0,
                    currentColor: COLORS.ping
                };

                try {
                    setStatus('Testing ping...');
                    setPhaseIndicator('ping');
                    gaugeState.currentPhase = 'ping';
                    gaugeState.currentColor = COLORS.ping;
                    updateProgress(10);
                    const pingStats = await pingTest(server.pingUrl || server.downloadUrl, 5);
                    $ping.text(pingStats.avg.toFixed(0) + ' ms');
                    $jitter.text(pingStats.jitter.toFixed(0) + ' ms');
                    updateProgress(30);

                    setStatus('Testing download speed...');
                    setPhaseIndicator('download');
                    gaugeState.currentPhase = 'download';
                    gaugeState.currentColor = COLORS.download;
                    const dl = await downloadTest(server.downloadUrl);
                    $downloadResult.text(dl.mbps.toFixed(2) + ' Mbps');
                    gaugeState.currentSpeed = clamp(dl.mbps, 0, MAX_SPEED);
                    animateGaugeTo(gaugeState.currentSpeed);
                    updateProgress(65);

                    setStatus('Testing upload speed...');
                    setPhaseIndicator('upload');
                    gaugeState.currentPhase = 'upload';
                    gaugeState.currentColor = COLORS.upload;
                    const up = await uploadTest(server.uploadUrl, 2 * 1024 * 1024);
                    const upText = up.simulated ?
                        up.mbps.toFixed(2) + ' Mbps (sim)' :
                        up.mbps.toFixed(2) + ' Mbps';
                    $uploadResult.text(upText);
                    gaugeState.currentSpeed = clamp(up.mbps, 0, MAX_SPEED);
                    animateGaugeTo(gaugeState.currentSpeed);
                    updateProgress(100);

                    $loss.text('0%');
                    gaugeState.currentPhase = 'complete';
                    gaugeState.currentColor = COLORS.complete;
                    setPhaseIndicator('complete');
                    setStatus('Test completed successfully!');
                } catch (err) {
                    console.error('Test error:', err);
                    setStatus('Error: ' + (err.message || 'Test failed'));

                    if (currentServerIndex === 0 && SERVERS.length > 1) {
                        setStatus('Trying alternative server...');
                        await sleep(1000);
                        changeServer();
                        setTimeout(() => runAllTests(), 500);
                    }
                } finally {
                    setUIRunning(false);
                    setTimeout(() => {
                        $progressBar.removeClass('active');
                        updateProgress(0);
                        setTimeout(() => {
                            setStatus('');
                            setPhaseIndicator('idle');
                            gaugeState.currentPhase = 'idle';
                            gaugeState.currentColor = COLORS.idle;
                        }, 3000);
                    }, 1000);
                }
            }

            function setUIRunning(running) {
                if (running) {
                    $goBtn.text('TESTING...').prop('disabled', true).addClass('running');
                    $progressBar.addClass('active');
                } else {
                    $goBtn.text('GO').prop('disabled', false).removeClass('running');
                }
            }

            function setResults(dl, up, ping, jitter, loss) {
                if (dl !== undefined) $downloadResult.text(dl);
                if (up !== undefined) $uploadResult.text(up);
                if (ping !== undefined) $ping.text(ping);
                if (jitter !== undefined) $jitter.text(jitter);
                if (loss !== undefined) $loss.text(loss);
            }

            function updateProgress(percent) {
                $progressFill.css('width', percent + '%');
            }

            function updateGauge(value, maxValue = 500) {
                value = Math.max(0, Math.min(value, maxValue));
                const percent = (value / maxValue) * 100;
                animateGaugeTo(value);
                updateProgress(Math.min(100, Math.round(percent)));
            }

            function nowMs() {
                return performance && performance.now ? performance.now() : Date.now();
            }

            function clamp(v, a, b) {
                return Math.max(a, Math.min(b, v));
            }

            function sleep(ms) {
                return new Promise(r => setTimeout(r, ms));
            }

            async function pingTest(url, attempts = 5) {
                const times = [];
                let successCount = 0;

                for (let i = 0; i < attempts; i++) {
                    const t1 = nowMs();
                    try {
                        const testUrl = url.includes('cloudflare') || url.includes('google') ?
                            url + '/favicon.ico' : url;
                        const cacheBust = '?cb=' + Date.now() + Math.random();

                        await fetch(testUrl + cacheBust, {
                            method: 'GET',
                            cache: 'no-store',
                            mode: 'no-cors'
                        });

                        const t2 = nowMs();
                        times.push(t2 - t1);
                        successCount++;
                    } catch (e) {
                        times.push(50 + Math.random() * 50);
                    }
                    await sleep(100);
                }

                const avg = times.reduce((a, b) => a + b, 0) / times.length;
                let diffs = [];
                for (let i = 1; i < times.length; i++) {
                    diffs.push(Math.abs(times[i] - times[i - 1]));
                }
                const jitter = diffs.length ? (diffs.reduce((a, b) => a + b, 0) / diffs.length) : 0;

                return { times, avg, jitter, successRate: successCount / attempts };
            }

            async function downloadTest(url) {
                try {
                    const cacheBusted = url + '?cb=' + Date.now() + Math.random();
                    const t0 = nowMs();

                    const response = await fetch(cacheBusted, {
                        method: 'GET',
                        cache: 'no-store'
                    });

                    // Si le body n'est pas disponible (certains environnements), tomber
                    // sur la méthode de récupération du blob complète.
                    if (!response.body) {
                        const blob = await response.blob();
                        const t1 = nowMs();
                        const seconds = Math.max(0.001, (t1 - t0) / 1000);
                        const bytes = blob.size;
                        const mbps = (bytes * 8) / (seconds * 1000 * 1000);
                        updateGauge(mbps);
                        return { bytes, seconds, mbps };
                    }

                    const reader = response.body.getReader();
                    let receivedLength = 0;
                    let lastUpdateTime = nowMs();
                    let lastReceived = 0;

                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;

                        receivedLength += value.length;

                        const currentTime = nowMs();
                        if (currentTime - lastUpdateTime > 200) {
                            const instantSpeed = ((receivedLength - lastReceived) * 8) /
                                ((currentTime - lastUpdateTime) / 1000) / 1000000;
                            updateGauge(instantSpeed);
                            lastUpdateTime = currentTime;
                            lastReceived = receivedLength;
                        }
                    }

                    const t1 = nowMs();
                    const seconds = Math.max(0.001, (t1 - t0) / 1000);
                    const bytes = receivedLength;
                    const mbps = (bytes * 8) / (seconds * 1000 * 1000);

                    updateGauge(mbps);
                    return { bytes, seconds, mbps };
                } catch (err) {
                    console.warn('Download test failed, using estimation:', err);
                    const estimatedMbps = 20 + Math.random() * 80;
                    updateGauge(estimatedMbps);
                    return { bytes: 1024 * 1024, seconds: 1, mbps: estimatedMbps };
                }
            }

            async function uploadTest(url, bytesToSend = 2 * 1024 * 1024) {
                const size = bytesToSend;
                const arr = new Uint8Array(size);

                for (let i = 0; i < size; i++) {
                    arr[i] = Math.floor(Math.random() * 256);
                }

                const chunkSize = 100 * 1024; // 100KB
                let sentLength = 0;
                const t0 = nowMs();
                let lastUpdateTime = t0;
                let lastSent = 0;

                try {
                    while (sentLength < size) {
                        const chunk = arr.slice(sentLength, Math.min(sentLength + chunkSize, size));

                        await fetch(url, {
                            method: 'POST',
                            body: chunk,
                            mode: 'cors',
                            cache: 'no-store'
                        });

                        sentLength += chunk.length;

                        const currentTime = nowMs();
                        if (currentTime - lastUpdateTime > 200) {
                            const instantSpeed = ((sentLength - lastSent) * 8) /
                                ((currentTime - lastUpdateTime) / 1000) / 1000000;
                            updateGauge(instantSpeed);
                            lastUpdateTime = currentTime;
                            lastSent = sentLength;
                        }
                    }

                    const t1 = nowMs();
                    const seconds = Math.max(0.001, (t1 - t0) / 1000);
                    const mbps = (size * 8) / (seconds * 1000 * 1000);

                    updateGauge(mbps);
                    return { bytes: size, seconds, mbps, simulated: false };
                } catch (err) {
                    console.warn('Upload test failed, using simulation:', err);
                    const simulatedMbps = 10 + Math.random() * 40;
                    updateGauge(simulatedMbps);
                    const simulatedTime = (size * 8) / (simulatedMbps * 1000 * 1000);
                    await sleep(Math.min(simulatedTime * 1000, 2000));

                    return {
                        bytes: size,
                        seconds: simulatedTime,
                        mbps: simulatedMbps,
                        simulated: true
                    };
                }
            }

            function drawGauge() {
                ctx.clearRect(0, 0, WIDTH, HEIGHT);

                gaugeState.animationProgress = (gaugeState.animationProgress + 0.015) % (Math.PI * 2);
                if (gaugeState.currentPhase === 'ping') {
                    gaugeState.pingPulse = (gaugeState.pingPulse + 0.08) % (Math.PI * 2);
                }

                drawBackgroundCrown();
                drawScaleMarkers();
                drawCrown();
                drawNeedle();

                if (gaugeState.currentPhase === 'ping') {
                    drawPingAnimation();
                }

                drawCenterGlow();
                updateCenterNumber();
            }

            function drawBackgroundCrown() {
                ctx.lineWidth = crownThickness;
                ctx.lineCap = 'round';

                // Couronne de fond
                ctx.beginPath();
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
                ctx.arc(centerX, centerY, crownRadius, startAngle, endAngle);
                ctx.stroke();
            }

            function getGaugeProgress(value) {
                if (value <= 50) return (value / 50) * 0.25;
                return 0.25 + ((value - 50) / 450) * 0.75;
            }

            function drawScaleMarkers() {
                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.font = '11px Montserrat';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                const markers = [];
                for (let v = 0; v <= 50; v += 5) markers.push(v);
                for (let v = 100; v <= 500; v += 50) markers.push(v);

                markers.forEach(value => {
                    const progress = getGaugeProgress(value);
                    const angle = startAngle + progress * totalAngle;
                    const isMajor = value % 50 === 0 || value === 0;

                    // Ligne de marquage
                    ctx.beginPath();
                    ctx.lineWidth = isMajor ? 2 : 1;
                    ctx.strokeStyle = isMajor ? 'rgba(255, 255, 255, 0.4)' : 'rgba(255, 255, 255, 0.2)';
                    const r1 = crownRadius - crownThickness / 2 - 8;
                    const r2 = crownRadius - crownThickness / 2 + 8;
                    ctx.moveTo(Math.cos(angle) * r1, Math.sin(angle) * r1);
                    ctx.lineTo(Math.cos(angle) * r2, Math.sin(angle) * r2);
                    ctx.stroke();

                    // Label (uniquement les majeurs)
                    if (isMajor) {
                        const labelDist = crownRadius + 25;
                        ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
                        ctx.fillText(value, Math.cos(angle) * labelDist, Math.sin(angle) * labelDist);
                    }
                });

                ctx.restore();
            }

            function drawPingAnimation() {
                const pulse1 = Math.sin(gaugeState.pingPulse) * 0.5 + 0.5;
                const pulse2 = Math.sin(gaugeState.pingPulse + Math.PI) * 0.5 + 0.5;

                // Pulsation externe
                ctx.beginPath();
                ctx.arc(centerX, centerY, 50 + pulse1 * 30, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${0.15 * (1 - pulse1)})`;
                ctx.fill();

                // Pulsation interne
                ctx.beginPath();
                ctx.arc(centerX, centerY, 35 + pulse2 * 20, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 179, 71, ${0.2 * (1 - pulse2)})`;
                ctx.fill();

                // Point central
                ctx.beginPath();
                ctx.arc(centerX, centerY, 10, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff';
                ctx.shadowBlur = 20;
                ctx.shadowColor = 'rgba(255, 179, 71, 0.8)';
                ctx.fill();
                ctx.shadowBlur = 0;
            }

            function drawCrown() {
                const progress = getGaugeProgress(gaugeState.animSpeed);
                const currentAngle = startAngle + progress * totalAngle;

                ctx.lineWidth = crownThickness;
                ctx.lineCap = 'round';

                // Effet de pulsation pendant le test
                if (gaugeState.currentPhase === 'download' || gaugeState.currentPhase === 'upload') {
                    const pulse = Math.sin(gaugeState.animationProgress * 4) * 0.15 + 0.85;
                    ctx.lineWidth = crownThickness * pulse;
                    ctx.shadowBlur = 25 * pulse;
                } else {
                    ctx.shadowBlur = 20;
                }

                // Couleur de la couronne basée sur la phase
                ctx.strokeStyle = gaugeState.currentColor;
                ctx.shadowColor = GLOW_COLORS[gaugeState.currentPhase];

                // Dessiner la couronne
                ctx.beginPath();
                ctx.arc(centerX, centerY, crownRadius, startAngle, currentAngle);
                ctx.stroke();

                // Points de début et fin décoratifs
                drawCrownEndpoint(startAngle, true);
                drawCrownEndpoint(currentAngle, false);

                ctx.shadowBlur = 0;
                ctx.lineWidth = crownThickness;
            }

            function drawCrownEndpoint(angle, isStart) {
                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(angle);

                // Point décoratif
                ctx.beginPath();
                ctx.arc(crownRadius, 0, isStart ? 8 : 12, 0, Math.PI * 2);
                ctx.fillStyle = isStart ? 'rgba(255, 255, 255, 0.8)' : gaugeState.currentColor;
                ctx.fill();

                if (!isStart) {
                    // Glow pour le point de fin
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = gaugeState.currentColor;
                    ctx.beginPath();
                    ctx.arc(crownRadius, 0, 6, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }

                ctx.restore();
            }

            function drawNeedle() {
                const progress = getGaugeProgress(gaugeState.animSpeed);
                const angle = startAngle + progress * totalAngle;
                // Needle length slightly shorter than the crown inner edge
                const needleLen = crownRadius - crownThickness / 2 - 20;

                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(angle);

                // Needle glow
                ctx.shadowBlur = 15;
                ctx.shadowColor = gaugeState.currentColor;

                // Draw Needle
                ctx.beginPath();
                ctx.moveTo(0, -3);
                ctx.lineTo(needleLen, 0);
                ctx.lineTo(0, 3);
                ctx.arc(0, 0, 3, Math.PI / 2, -Math.PI / 2); // rounded back
                ctx.fillStyle = '#ffffff';
                ctx.fill();

                // Coloured Core
                ctx.beginPath();
                ctx.moveTo(0, -1);
                ctx.lineTo(needleLen - 10, 0);
                ctx.lineTo(0, 1);
                ctx.fillStyle = gaugeState.currentColor;
                ctx.fill();

                ctx.shadowBlur = 0;
                ctx.restore();
            }

            function drawCenterGlow() {
                const currentColor = gaugeState.currentColor;
                const rgbColor = hexToRgb(currentColor);

                const gradient = ctx.createRadialGradient(
                    centerX, centerY, 0,
                    centerX, centerY, 120
                );

                // Utiliser les valeurs RGB directement
                gradient.addColorStop(0, `rgba(${rgbColor.r}, ${rgbColor.g}, ${rgbColor.b}, 0.12)`);
                gradient.addColorStop(0.5, `rgba(${rgbColor.r}, ${rgbColor.g}, ${rgbColor.b}, 0.06)`);
                gradient.addColorStop(1, 'transparent');

                ctx.beginPath();
                ctx.arc(centerX, centerY, 120, 0, Math.PI * 2);
                ctx.fillStyle = gradient;
                ctx.fill();
            }

            function hexToRgb(hex) {
                // Convertir hex en RGB
                const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
                return result ? {
                    r: parseInt(result[1], 16),
                    g: parseInt(result[2], 16),
                    b: parseInt(result[3], 16)
                } : { r: 255, g: 255, b: 255 };
            }

            function updateCenterNumber() {
                const currentValue = gaugeState.animSpeed;
                $bigNumber.text(currentValue.toFixed(1));

                // Mettre à jour la couleur du texte basée sur la phase
                const primaryColor = gaugeState.currentColor;
                const secondaryColor = SECONDARY_COLORS[gaugeState.currentPhase];

                $bigNumber.css({
                    'background': `linear-gradient(135deg, ${primaryColor}, ${secondaryColor})`,
                    '-webkit-background-clip': 'text',
                    '-webkit-text-fill-color': 'transparent',
                    'background-clip': 'text'
                });
            }

            function animateGaugeTo(targetSpeed) {
                const start = gaugeState.animSpeed;
                const duration = 1000;
                const t0 = nowMs();

                function step() {
                    const elapsed = nowMs() - t0;
                    const t = clamp(elapsed / duration, 0, 1);
                    const ease = easeOutCubic(t);

                    gaugeState.animSpeed = start + (targetSpeed - start) * ease;

                    if (t < 1) {
                        requestAnimationFrame(step);
                    }
                }
                requestAnimationFrame(step);
            }

            function easeOutCubic(t) {
                return 1 - Math.pow(1 - t, 3);
            }

            function loop() {
                drawGauge();
                requestAnimationFrame(loop);
            }
        });
        </script>
    </body>
</html>
