<body>

        <!-- Main Content -->

            <!-- Main Panel: Éditeur -->

                </h2>

                    <i class="fas fa-info-circle"></i>
                    <span id="infoText">Sélectionnez une catégorie pour commencer</span>

                <div class="groups-filter">

                        <span class="filter-hint">1 clic : a le groupe &middot; 2 clics : n'a pas le groupe &middot; 3 clics : aucun</span>

                            Sélectionnez une catégorie

                <div class="action-buttons">

    <div class="apply-overlay" id="applyOverlay">
        <i class="fas fa-spinner"></i>
        <span id="applyOverlayText">Application des changements...</span>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <!-- Scripts -->
    <script src="vendor/jquery/jquery-3.7.1.min.js"></script>
    <script src="js/dhis2-session-manager.js"></script>
    <script src="js/dhis2-auth.js"></script>
    <script src="js/interaction-manager.js"></script>

    <script>
        let allOrgUnits = { without_groups: [], incomplete_groups: [], complete: [] };
        let allGroups = [];
        let selectedCategory = 'without_groups';
        let currentOrgUnits = [];
        let changes = new Map();
        let levels = [];
        let groupFilters = new Map();
        let currentPage = 1;
        let pageSize = 100;

        const apiUrl = 'api/assign-org-units-groups.php';

        $(document).ready(async function() {
            // Vérifier la connexion
            if (!dhis2Session.isConnected()) {
                showToast('error', 'Session requise', 'Veuillez vous connecter à DHIS2.');
                setTimeout(() => { window.location.href = 'index.html'; }, 2000);
                return;
            }

            try {
                await loadData();
                renderCategories();
                attachEventListeners();
            } catch (error) {
                console.error('Erreur:', error);
                showToast('error', 'Erreur', `${error.message}`);
            }
        });

        async function loadData() {
            const config = dhis2Session.getConfig();
            const payload = {
                dhis2_url: config.url,
                dhis2_auth: config.authHeader
            };

            try {
                // Charger les groupes
                const groupsResp = await $.ajax({
                    url: `${apiUrl}?action=groups`,
                    method: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify(payload)
                });

                if (groupsResp.success) {
                    allGroups = groupsResp.data.groups;
                }

                // Charger les structures
                const listResp = await $.ajax({
                    url: `${apiUrl}?action=list`,
                    method: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify(payload)
                });

                if (listResp.success) {
                    allOrgUnits = listResp.data.categorized;
                }

                const levelsResp = await dhis2Session.get('/api/organisationUnitLevels.json?fields=id,displayName,level&paging=false&order=level:asc');
                levels = (levelsResp && levelsResp.organisationUnitLevels) || [];
                const selectedLevel = $('#levelFilter').val();
                $('#levelFilter').html('<option value="">Tous les niveaux</option>' +
                    levels.map(l => `<option value="${l.level}">${l.displayName} (niveau ${l.level})</option>`).join(''))
                    .val(selectedLevel);
            } catch (error) {
                throw new Error(`Échec du chargement: ${error.statusText || error.message}`);
            }
        }

        function renderCategories() {
            const categoryList = $('#categoryList');
            const categories = [
                { key: 'without_groups', label: 'Sans groupe', icon: '🔴' },
                { key: 'incomplete_groups', label: 'Groupes incomplets', icon: '🟡' },
                { key: 'complete', label: 'Complets', icon: '🟢' }
            ];

            let html = '';
            categories.forEach(cat => {
                const isActive = cat.key === selectedCategory ? 'active' : '';
                const count = allOrgUnits[cat.key].length;
                html += `
                    <div class="category-item ${isActive}" data-category="${cat.key}">
                        <span>${cat.icon}</span>
                        ${cat.label}
                        <span class="category-badge">${count}</span>
                    </div>
                `;
            });

            categoryList.html(html);
        }

        function selectCategory(categoryKey) {
            selectedCategory = categoryKey;
            currentOrgUnits = allOrgUnits[categoryKey];
            groupFilters.clear();
            currentPage = 1;
            changes.clear();
            $('#searchName').val('');
            $('#levelFilter').val('');

            $('.category-item').removeClass('active');
            $(`[data-category="${categoryKey}"]`).addClass('active');

            renderGroupsFilter();
            renderTable();
            updateInfoBar();
        }

        function renderGroupsFilter() {
            const groupsFilter = $('#groupsFilter');
            groupsFilter.html(allGroups.map(group => {
                const state = groupFilters.get(group.id) || '';
                return `<button class="group-btn ${state}" data-group-id="${group.id}">${group.displayName}</button>`;
            }).join(''));

            groupsFilter.find('.group-btn').click(function() {
                const groupId = $(this).data('group-id');
                const current = groupFilters.get(groupId);
                if (!current) groupFilters.set(groupId, 'has');
                else if (current === 'has') groupFilters.set(groupId, 'hasnot');
                else groupFilters.delete(groupId);

                $(this).removeClass('has hasnot').addClass(groupFilters.get(groupId) || '');
                currentPage = 1;
                renderTable();
            });
        }

        function normalizeText(str) {
            return (str || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
        }

        function getVisibleOrgUnits() {
            const term = normalizeText($('#searchName').val().trim());
            const level = $('#levelFilter').val();
            return currentOrgUnits.filter(ou => {
                if (term && !normalizeText(ou.displayName).includes(term)) return false;
                if (level && String(ou.level) !== level) return false;
                if (groupFilters.size === 0) return true;
                const ids = ou.groups.map(g => g.id);
                for (const [gid, state] of groupFilters) {
                    if (state === 'has' && !ids.includes(gid)) return false;
                    if (state === 'hasnot' && ids.includes(gid)) return false;
                }
                return true;
            });
        }

        function renderPagination(total) {
            const pages = Math.max(1, Math.ceil(total / pageSize));
            const from = total === 0 ? 0 : (currentPage - 1) * pageSize + 1;
            const to = Math.min(total, currentPage * pageSize);

            $('#paginationBar').html(`
                <span>${from}-${to} sur ${total}</span>
                <span>
                    <button type="button" id="pgPrev" ${currentPage <= 1 ? 'disabled' : ''}><i class="fas fa-chevron-left"></i></button>
                    <span style="margin: 0 8px;">Page ${currentPage} / ${pages}</span>
                    <button type="button" id="pgNext" ${currentPage >= pages ? 'disabled' : ''}><i class="fas fa-chevron-right"></i></button>
                </span>
                <span>Lignes par page :
                    <select id="pgSize">
                        ${[50, 100, 200, 500].map(n => `<option value="${n}" ${n === pageSize ? 'selected' : ''}>${n}</option>`).join('')}
                    </select>
                </span>
            `);

            $('#pgPrev').click(() => { currentPage--; renderTable(); });
            $('#pgNext').click(() => { currentPage++; renderTable(); });
            $('#pgSize').change(function() { pageSize = parseInt($(this).val(), 10); currentPage = 1; renderTable(); });
        }

        function renderTable() {
            const tableContainer = $('#tableContainer');
            const filtered = getVisibleOrgUnits();
            const pages = Math.max(1, Math.ceil(filtered.length / pageSize));
            if (currentPage > pages) currentPage = pages;
            const visibleOrgUnits = filtered.slice((currentPage - 1) * pageSize, currentPage * pageSize);

            renderPagination(filtered.length);

            if (visibleOrgUnits.length === 0) {
                tableContainer.html(`
                    <div class="empty-state">
                        <i class="fas fa-inbox"></i>
                        ${currentOrgUnits.length === 0 ? 'Aucune structure dans cette catégorie' : 'Aucune structure ne correspond au filtre'}
                    </div>
                `);
                updateInfoBar();
                return;
            }

            let html = `
                <table>
                    <thead>
                        <tr>
                            <th class="sticky-col" style="width: 40px; min-width: 40px;"><input type="checkbox" id="selectAll" class="input-checkbox"></th>
                            <th class="sticky-name">Structure</th>
                            ${allGroups.map(g => `<th class="group-col" data-col="${g.id}" title="${g.displayName}"><span>${g.displayName}</span></th>`).join('')}
                            <th class="sticky-total">Total</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            visibleOrgUnits.forEach(ou => {
                html += `
                    <tr data-ou-id="${ou.id}">
                        <td class="sticky-col"><input type="checkbox" class="select-row input-checkbox" data-ou-id="${ou.id}"></td>
                        <td class="ou-name sticky-name">${ou.displayName}</td>
                `;

                allGroups.forEach(group => {
                    const currentGroups = changes.has(ou.id)
                        ? changes.get(ou.id)
                        : ou.groups.map(g => g.id);
                    const isChecked = currentGroups.includes(group.id) ? 'checked' : '';
                    html += `
                        <td style="text-align: center;" data-col="${group.id}">
                            <input type="checkbox"
                                   class="group-checkbox input-checkbox"
                                   data-ou-id="${ou.id}"
                                   data-group-id="${group.id}"
                                   ${isChecked}>
                        </td>
                    `;
                });

                const totalCount = changes.has(ou.id)
                    ? changes.get(ou.id).length
                    : ou.groups.length;
                html += `
                    <td class="sticky-total" style="font-weight: 600;">
                        <span class="group-count">${totalCount}</span>
                    </td>
                    </tr>
                `;
            });

            html += `</tbody></table>`;
            tableContainer.html(html);
            attachTableEventListeners();
        }

        function attachTableEventListeners() {
            const selectAllCheckbox = $('#selectAll');
            const rowCheckboxes = $('.select-row');
            const groupCheckboxes = $('.group-checkbox');

            selectAllCheckbox.off('change').on('change', function() {
                rowCheckboxes.prop('checked', $(this).prop('checked'));
            });

            rowCheckboxes.off('change').on('change', function() {
                const ouId = $(this).data('ou-id');
                const row = $(`tr[data-ou-id="${ouId}"]`);
                $(this).prop('checked') ? row.addClass('selected') : row.removeClass('selected');
            });

            groupCheckboxes.off('change').on('change', function() {
                const ouId = $(this).data('ou-id');
                const groupId = $(this).data('group-id');

                if (!changes.has(ouId)) {
                    const ou = currentOrgUnits.find(o => o.id === ouId);
                    changes.set(ouId, ou.groups.map(g => g.id));
                }

                const currentGroups = changes.get(ouId);
                if ($(this).prop('checked')) {
                    if (!currentGroups.includes(groupId)) {
                        currentGroups.push(groupId);
                    }
                } else {
                    const index = currentGroups.indexOf(groupId);
                    if (index > -1) {
                        currentGroups.splice(index, 1);
                    }
                }

                const row = $(`tr[data-ou-id="${ouId}"]`);
                row.find('.group-count').text(currentGroups.length);

                updateApplyButton();
            });
        }

        function updateInfoBar() {
            const total = currentOrgUnits.length;
            const shown = getVisibleOrgUnits().length;
            const count = shown === total ? total : `${shown} sur ${total}`;
            const labels = {
                'without_groups': 'structures sans groupe',
                'incomplete_groups': 'structures avec groupes incomplets',
                'complete': 'structures complètes'
            };
            const pending = changes.size ? ` · ${changes.size} modification(s) en attente` : '';
            $('#infoText').text(`${count} ${labels[selectedCategory]}${pending}`);
        }

        function updateApplyButton() {
            $('#applyBtn').prop('disabled', changes.size === 0);
            updateInfoBar();
        }

        function attachEventListeners() {
            $('#categoryList').off('click', '.category-item').on('click', '.category-item', function() {
                selectCategory($(this).data('category'));
            });

            $('#levelFilter').off('change').on('change', function() { currentPage = 1; renderTable(); });
            $('#exportCsvBtn').off('click').on('click', exportCsv);
            $('#searchName').off('input').on('input', function() { currentPage = 1; renderTable(); });
            $('#clearGroupFilters').off('click').on('click', function() {
                groupFilters.clear();
                currentPage = 1;
                renderGroupsFilter();
                renderTable();
            });
            $('#tableContainer')
                .off('.crosshair')
                .on('mouseover.crosshair', 'td[data-col]', function() { markCrosshair('hl', $(this)); })
                .on('mouseleave.crosshair', 'table', function() { markCrosshair('hl', null); })
                .on('click.crosshair', 'td[data-col]', function() { markCrosshair('act', $(this)); });

            $('#applyBtn').off('click').on('click', applyChanges);
            $('#resetBtn').off('click').on('click', resetChanges);
        }

        async function applyChanges() {
            if (changes.size === 0) {
                showToast('info', 'Info', 'Aucun changement à appliquer');
                return;
            }

            setBusy(true);

            const assignments = Array.from(changes.entries()).map(([ouId, groupIds]) => ({
                ouId,
                groupIds
            }));

            const config = dhis2Session.getConfig();
            const batchSize = 20;
            const done = [];
            const failed = [];

            try {
                for (let i = 0; i < assignments.length; i += batchSize) {
                    $('#applyOverlayText').text(`Application des changements... ${Math.min(i, assignments.length)} / ${assignments.length}`);

                    const response = await $.ajax({
                        url: `${apiUrl}?action=assign`,
                        method: 'POST',
                        contentType: 'application/json',
                        data: JSON.stringify({
                            dhis2_url: config.url,
                            dhis2_auth: config.authHeader,
                            assignments: assignments.slice(i, i + batchSize)
                        })
                    });

                    if (!response.success) throw new Error(response.message);
                    response.data.results.success.forEach(r => done.push(r.ouId));
                    response.data.results.failed.forEach(r => failed.push(r));
                }
            } catch (error) {
                showToast('error', 'Erreur', `${error.statusText || error.message}. ${done.length} structure(s) déjà enregistrée(s).`);
            } finally {
                applyLocally(done);
                if (failed.length > 0) {
                    showToast('error', 'Échec partiel', `${done.length} réussies, ${failed.length} en erreur. Ex : ${failed[0].error}`);
                    console.error('Échecs affectation:', failed);
                } else if (done.length > 0) {
                    showToast('success', 'Succès', `${done.length} structures mises à jour`);
                }
                setBusy(false);
                updateApplyButton();
            }
        }

        function setBusy(busy) {
            $('#applyOverlay').css('display', busy ? 'flex' : 'none');
            $('.module-container').attr('inert', busy ? '' : null);
            if (busy) $('#applyBtn, #resetBtn').prop('disabled', true);
            else $('#resetBtn').prop('disabled', false);
        }

        window.showToast = function (type, title, message) {
            const icons = { success: 'fa-check-circle', error: 'fa-exclamation-circle', warning: 'fa-exclamation-triangle', info: 'fa-info-circle' };
            const toast = $(`<div class="toast toast-${type}"><i class="fas ${icons[type]}"></i><div class="toast-content"><div class="toast-title">${title}</div><div class="toast-message">${message}</div></div></div>`);
            $('#toastContainer').append(toast);
            setTimeout(() => toast.fadeOut(300, function () { $(this).remove(); }), 5000);
        };

        function exportCsv() {
            const rows = getVisibleOrgUnits();
            if (rows.length === 0) {
                showToast('warning', 'Export', 'Aucune structure à exporter.');
                return;
            }

            const esc = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
            let csv = 'ID,Nom,Niveau,Parent Direct,Groupes\n';
            rows.forEach(ou => {
                const groups = ou.groups.map(g => g.displayName).join('; ');
                csv += [ou.id, ou.displayName, ou.level, ou.parent, groups].map(esc).join(',') + '\n';
            });

            const blob = new Blob([new Uint8Array([0xEF, 0xBB, 0xBF]), csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `structures_${selectedCategory}_${new Date().toISOString().slice(0, 10)}.csv`;
            link.click();
            URL.revokeObjectURL(link.href);
            showToast('success', 'Export', `${rows.length} structures exportées.`);
        }

        function markCrosshair(prefix, $cell) {
            const $table = $('#tableContainer table');
            $table.find(`.${prefix}-r, .${prefix}-c`).removeClass(`${prefix}-r ${prefix}-c`);
            if (!$cell) return;
            $cell.closest('tr').children('td').addClass(`${prefix}-r`);
            $table.find(`[data-col="${$cell.data('col')}"]`).addClass(`${prefix}-c`);
        }

        function applyLocally(doneIds) {
            const all = [...allOrgUnits.without_groups, ...allOrgUnits.incomplete_groups, ...allOrgUnits.complete];
            const doneSet = new Set(doneIds);

            all.forEach(ou => {
                if (doneSet.has(ou.id) && changes.has(ou.id)) {
                    const ids = changes.get(ou.id);
                    ou.groups = allGroups.filter(g => ids.includes(g.id)).map(g => ({ id: g.id, displayName: g.displayName }));
                    ou.groupCount = ou.groups.length;
                    changes.delete(ou.id);
                }
            });

            const total = allGroups.length;
            allOrgUnits = { without_groups: [], incomplete_groups: [], complete: [] };
            all.forEach(ou => {
                const key = ou.groupCount === 0 ? 'without_groups' : (ou.groupCount < total ? 'incomplete_groups' : 'complete');
                allOrgUnits[key].push(ou);
            });

            Object.values(allOrgUnits).forEach(list => list.sort((a, b) => a.displayName.localeCompare(b.displayName)));

            currentOrgUnits = allOrgUnits[selectedCategory];
            renderCategories();
            renderTable();
            updateInfoBar();
            updateApplyButton();
        }

        function resetChanges() {
            changes.clear();
            selectCategory(selectedCategory);
            showToast('info', 'Info', 'Les changements ont été réinitialisés');
        }
    </script>
</body>

</html>
